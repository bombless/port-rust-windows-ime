name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows-x64:
    name: Build and release Windows x64 DLL
    runs-on: windows-latest
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build release DLL
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Verify release assets
        shell: pwsh
        run: |
          $dll = "target/x86_64-pc-windows-msvc/release/port_rust_windows_ime.dll"
          if (!(Test-Path $dll)) {
            throw "Expected DLL was not produced: $dll"
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item $dll dist/
          Copy-Item install.ps1 dist/
          Get-ChildItem dist | Select-Object Name, Length

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/port_rust_windows_ime.dll
            dist/install.ps1
