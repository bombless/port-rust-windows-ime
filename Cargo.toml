[package]
name = "port-rust-windows-ime"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["implement", "Win32_Foundation", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_TextServices", "Win32_UI_WindowsAndMessaging"] }
windows-core = "0.58"
